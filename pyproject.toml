[project]
name = "echo-chamber"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.3,<3",
    "openai[realtime]>=3.7,<4",
    "aiohttp>=3.11,<4",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "numpy>=2,<3",
    "librosa>=1,<1.1",
    "soundfile>=0.14,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]
local-audio = ["pygame>=2.6,<3", "sounddevice>=0.5,<1"]
hardware = ["pyserial>=3.5,<4"]
subscription = ["PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1", "aiohttp>=3.11,<4", "openai>=2,<4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
